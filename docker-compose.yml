name: seletiva-interest-dev
services:
  adminer:
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    image: adminer
    networks:
      sah_dev_net: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: "no"
  backend:
    build:
      context: /home/jpamm/Seletiva-Interest-Dev-2025/backend
      dockerfile: Dockerfile
    command:
      - fastapi
      - run
      - --reload
      - app/main.py
    depends_on:
      db:
        condition: service_healthy
        required: true
      prestart:
        condition: service_completed_successfully
        required: true
    environment:
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173,https://localhost,https://localhost:5173,http://localhost.tiangolo.com
      DOCKER_IMAGE_BACKEND: backend
      DOCKER_IMAGE_FRONTEND: frontend
      DOMAIN: localhost
      EMAILS_FROM_EMAIL: example@interest.com.br
      EMAILS_FROM_NAME: example@interest.com.br
      ENVIRONMENT: local
      FIRST_SUPERUSER: example@interest.com.br
      FIRST_SUPERUSER_PASSWORD: changethis
      FRONTEND_HOST: http://localhost:5173
      HASHED_PASSWORD_TRAEFIK: $$2b$$12
      POSTGRES_DB: app
      POSTGRES_PASSWORD: e319bc888ef8711b3119709df75784c3f17b1e9dc8ff8da32832bbfec465b33e
      POSTGRES_PORT: "5432"
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      PROJECT_NAME: seletiva-interest-dev
      SCHEDULER_INTERVAL_MINUTES: "1"
      SECRET_KEY: '@USERinterest2025'
      SENTRY_DSN: ""
      SMTP_HOST: mailcatcher
      SMTP_PASSWORD: ""
      SMTP_PORT: "1025"
      SMTP_SSL: "False"
      SMTP_TLS: "false"
      SMTP_USER: ""
      STACK_NAME: seletiva-interest-dev
    networks:
      sah_dev_net: null
    restart: "no"
    volumes:
      - type: bind
        source: /home/jpamm/Seletiva-Interest-Dev-2025/backend
        target: /app
        bind:
          create_host_path: true
      - type: volume
        target: /app/.venv
        volume: {}
  db:
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: app
      POSTGRES_PASSWORD: e319bc888ef8711b3119709df75784c3f17b1e9dc8ff8da32832bbfec465b33e
      POSTGRES_USER: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 10s
      interval: 10s
      retries: 5
      start_period: 30s
    image: postgres:17
    networks:
      sah_dev_net: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: "no"
    volumes:
      - type: volume
        source: app-db-data
        target: /var/lib/postgresql/data/pgdata
        volume: {}
  dev-proxy:
    depends_on:
      backend:
        condition: service_started
        required: true
      scheduler:
        condition: service_started
        required: true
      sse:
        condition: service_started
        required: true
    image: nginx:stable
    networks:
      sah_dev_net: null
    ports:
      - mode: ingress
        target: 80
        published: "8000"
        protocol: tcp
    restart: "no"
    volumes:
      - type: bind
        source: /home/jpamm/Seletiva-Interest-Dev-2025/frontend/nginx.dev.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: true
  frontend:
    build:
      context: /home/jpamm/Seletiva-Interest-Dev-2025/frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
        VITE_API_BASE: http://localhost:8000
    depends_on:
      dev-proxy:
        condition: service_started
        required: true
    environment:
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173,https://localhost,https://localhost:5173,http://localhost.tiangolo.com
      DOCKER_IMAGE_BACKEND: backend
      DOCKER_IMAGE_FRONTEND: frontend
      DOMAIN: localhost
      EMAILS_FROM_EMAIL: example@interest.com.br
      EMAILS_FROM_NAME: example@interest.com.br
      ENVIRONMENT: local
      FIRST_SUPERUSER: example@interest.com.br
      FIRST_SUPERUSER_PASSWORD: changethis
      FRONTEND_HOST: http://localhost:5173
      HASHED_PASSWORD_TRAEFIK: $$2b$$12
      NODE_ENV: development
      POSTGRES_DB: app
      POSTGRES_PASSWORD: e319bc888ef8711b3119709df75784c3f17b1e9dc8ff8da32832bbfec465b33e
      POSTGRES_PORT: "5432"
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      PROJECT_NAME: seletiva-interest-dev
      SCHEDULER_INTERVAL_MINUTES: "1"
      SECRET_KEY: '@USERinterest2025'
      SENTRY_DSN: ""
      SMTP_HOST: ""
      SMTP_PASSWORD: ""
      SMTP_PORT: "587"
      SMTP_SSL: "False"
      SMTP_TLS: "True"
      SMTP_USER: ""
      STACK_NAME: seletiva-interest-dev
      VITE_API_BASE: http://localhost:8000
    networks:
      sah_dev_net: null
    ports:
      - mode: ingress
        target: 5173
        published: "5173"
        protocol: tcp
    restart: "no"
    volumes:
      - type: bind
        source: /home/jpamm/Seletiva-Interest-Dev-2025/frontend
        target: /app
        bind:
          create_host_path: true
      - type: volume
        target: /app/node_modules
        volume: {}
  mailcatcher:
    image: schickling/mailcatcher
    networks:
      sah_dev_net: null
    ports:
      - mode: ingress
        target: 1080
        published: "1080"
        protocol: tcp
      - mode: ingress
        target: 1025
        published: "1025"
        protocol: tcp
    restart: "no"
  prestart:
    build:
      context: /home/jpamm/Seletiva-Interest-Dev-2025/backend
      dockerfile: Dockerfile
    command:
      - bash
      - scripts/prestart.sh
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173,https://localhost,https://localhost:5173,http://localhost.tiangolo.com
      DOMAIN: localhost
      EMAILS_FROM_EMAIL: example@interest.com.br
      EMAILS_FROM_NAME: example@interest.com.br
      ENVIRONMENT: local
      FIRST_SUPERUSER: example@interest.com.br
      FIRST_SUPERUSER_PASSWORD: changethis
      FRONTEND_HOST: http://localhost:5173
      POSTGRES_DB: app
      POSTGRES_PASSWORD: e319bc888ef8711b3119709df75784c3f17b1e9dc8ff8da32832bbfec465b33e
      POSTGRES_PORT: "5432"
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      PROJECT_NAME: seletiva-interest-dev
      SECRET_KEY: '@USERinterest2025'
      SENTRY_DSN: ""
      SMTP_HOST: ""
      SMTP_PASSWORD: ""
      SMTP_USER: ""
    networks:
      sah_dev_net: null
  scheduler:
    build:
      context: /home/jpamm/Seletiva-Interest-Dev-2025/backend
