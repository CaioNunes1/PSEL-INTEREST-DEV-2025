version: "3.8"

services:
  db:
    image: postgres:15
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    restart: "no"
    ports:
      - "8080:8080"

  prestart:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache netcat-openbsd >/dev/null 2>&1 &&
             until nc -z db 5432; do echo waiting for db; sleep 1; done"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "8001:8000"
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app           # montamos código do host para dev
      - /app/.venv               # preserva venv no container (não sobrescreve)
    env_file:
      - .env                     # garanta ter .env no mesmo diretório onde roda o compose
    environment:
      - POSTGRES_SERVER=db
    depends_on:
      - prestart

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=http://localhost:8000

volumes:
  db-data:
